/* =====================================================
   SHUFFLE
===================================================== */

function shuffle(array){

    const result=[...array];

    for(
        let i=result.length-1;
        i>0;
        i--
    ){

        const j=
            Math.floor(
                Math.random()*(i+1)
            );


        [
            result[i],
            result[j]
        ]=[
            result[j],
            result[i]
        ];

    }

    return result;
}


/* =====================================================

class LineMatchGame
extends Phaser.Scene{

constructor(){

    super(
        "LineMatchGame"
    );

}


/* =====================================================
   CREATE
===================================================== */

create(){

    this.stageIndex=0;

    this.totalCorrect=0;

    this.mistakes=0;

    this.questionCards=[];

    this.answerCards=[];

    this.connections=[];


    /* ACTIVE LINE */

    this.draggingLine=false;

    this.activeQuestion=null;


    /* BACKGROUND */

    this.bg=
        this.add.graphics();


    this.drawBackground();


    /* PERMANENT LINE */

    this.lineGraphics=
        this.add.graphics()
        .setDepth(4);


    /* LINE USER SEDANG DRAG */

    this.tempLineGraphics=
        this.add.graphics()
        .setDepth(20);


    /* HEADER */

    this.createHeader();


    /* GLOBAL POINTER */

    this.setupPointerEvents();


    /* STAGE */

    this.buildStage();

}


/* =====================================================

===================================================== */

    g.clear();


    /* MAIN */

    g.fillStyle(
        0xeaf8ff,
        1

    g.fillRect(
        0,
        0,
        900,
        1200

    g.fillStyle(

        1

    g.fillRect(

    g.fillStyle(
        0xffda70,
        .75

    g.fillCircle(
        790,
        100,
        48
    );


    /* CLOUD */

    for(
        let i=0;
        i<5;
        i++

        const x=
            65+
            i*190;


        const y=
            100+
            (i%2)*50;


        g.fillStyle(
            0xffffff,
            .58

        g.fillCircle(
            x,
            y,
            25

        g.fillCircle(
            x+25,
            y+5,
            19

        g.fillCircle(

            17

        900,

        0x9bcba8,
        1

        460,
        820,

        705,
        1120

        0x82b993,

/* =====================================================
   POINTER EVENTS
===================================================== */

setupPointerEvents(){

    /* SEMASA GERAK */

    this.input.on(

        "pointermove",

        pointer=>{

            if(
                !this.draggingLine ||
                !this.activeQuestion
            ){

                return;

            }


            this.drawTemporaryLine(

                this.activeQuestion.dotX,

                this.activeQuestion.dotY,

                pointer.x,

                pointer.y

            );

        }

    );


    /* BILA LEPAS */

    this.input.on(

        "pointerup",

        pointer=>{

            if(
                !this.draggingLine ||
                !this.activeQuestion
            ){

                return;

            }


            this.finishLine(
                pointer
            );

        }

    );


    this.input.on(

        "pointerupoutside",

        pointer=>{

            if(
                !this.draggingLine
            ){

                return;

            }


            this.cancelLine();

        }

    );

}


/* =====================================================
   BUILD STAGE
===================================================== */

buildStage(){

    if(
        this.stageGroup
    ){

        this.stageGroup.clear(
            true,
            true
        );

    }


    this.stageGroup=
        this.add.group();


    this.lineGraphics.clear();

    this.tempLineGraphics.clear();


    this.connections=[];

    this.questionCards=[];

    this.answerCards=[];


    this.draggingLine=false;

    this.activeQuestion=null;


    const stage=
        STAGES[
            this.stageIndex
        ];


    const questions=
        stage.ids.map(

            id=>
                QUESTIONS.find(
                    q=>q.id===id
                )

        );


    const answers=
        shuffle(
            questions
        );


    this.stageText.setText(

        "STAGE "+
        (this.stageIndex+1)+
        "/5 • "+
        stage.title

    );


    this.updateProgress();


    this.createQuestionPanel();


    const startY=410;

    const gap=127;


    /* LEFT */

    questions.forEach(
        (question,index)=>{

            const card=
                this.createQuestionCard(

                    question,

                    startY+
                    index*gap

                );


            this.questionCards.push(
                card
            );

        }
    );


    /* RIGHT */

    answers.forEach(
        (question,index)=>{

            const card=
                this.createAnswerCard(

                    question,

                    startY+
                    index*gap

                );


            this.answerCards.push(
                card
            );

        }
    );


    this.createFooter();

}

/* =====================================================
   SHORT QUESTION
===================================================== */

shortQuestion(
    text,
    max=65
){

    if(
        text.length<=max
    ){

        return text;

    }


    return (
        text
        .substring(
            0,
            max-1
        )
        .trim()
        +"…"
    );

}

/* =====================================================
   START LINE
===================================================== */

startLine(
    questionCard,
    pointer
){

    if(
        this.draggingLine
    ){

        return;

    }


    this.draggingLine=true;

    this.activeQuestion=
        questionCard;


    this.showFullQuestion(
        questionCard.question
    );


    /* HIGHLIGHT SOURCE */

    questionCard.dot
        .setFillStyle(
            0x167ea5,
            1
        );


    questionCard.ring
        .setScale(1.15);


    this.drawTemporaryLine(

        questionCard.dotX,

        questionCard.dotY,

        pointer.x,

        pointer.y

    );

}


/* =====================================================
   DRAW TEMPORARY LINE
===================================================== */

drawTemporaryLine(
    x1,
    y1,
    x2,
    y2
){

    const g=
        this.tempLineGraphics;


    g.clear();


    /* WHITE OUTER */

    g.lineStyle(
        13,
        0xffffff,
        .95
    );


    g.beginPath();


    g.moveTo(
        x1,
        y1
    );


    g.lineTo(
        x2,
        y2
    );


    g.strokePath();


    /* BLUE LINE */

    g.lineStyle(
        7,
        0x2d98bd,
        1
    );


    g.beginPath();


    g.moveTo(
        x1,
        y1
    );


    g.lineTo(
        x2,
        y2
    );


    g.strokePath();


    /* END CIRCLE */

    g.fillStyle(
        0x2d98bd,
        1
    );


    g.fillCircle(
        x2,
        y2,
        9
    );

}


/* =====================================================
   FINISH LINE
===================================================== */

finishLine(
    pointer
){

    const questionCard=
        this.activeQuestion;


    const target=
        this.findAnswerTarget(
            pointer.x,
            pointer.y
        );


    if(
        !target
    ){

        this.cancelLine();

        return;

    }


    const isCorrect=

        questionCard.question.a===
        target.question.a;


    if(isCorrect){

        this.correctLine(
            questionCard,
            target
        );

    }

    else{

        this.wrongLine(
            questionCard,
            target
        );

    }

}


/* =====================================================
   FIND NEAREST ANSWER DOT
===================================================== */

findAnswerTarget(
    pointerX,
    pointerY
){

    let nearest=null;

    let nearestDistance=
        Infinity;


    for(
        const answerCard
        of this.answerCards
    ){

        if(
            answerCard.matched
        ){

            continue;

        }


        const distance=
            Phaser.Math.Distance.Between(

                pointerX,
                pointerY,

                answerCard.dotX,
                answerCard.dotY

            );


        /*
            BIG DROP AREA
            Easier for phone/tablet
        */

        if(
            distance<70 &&
            distance<nearestDistance
        ){

            nearest=
                answerCard;


            nearestDistance=
                distance;

        }

    }


    return nearest;

}


/* =====================================================
   CORRECT
===================================================== */

correctLine(
    questionCard,
    answerCard
){

    this.tempLineGraphics.clear();


    this.draggingLine=false;

    this.activeQuestion=null;


    questionCard.matched=true;

    answerCard.matched=true;


    questionCard.hit.disableInteractive();

    questionCard.rect.disableInteractive();


    this.totalCorrect++;


    /* SAVE CONNECTION */

    this.connections.push({

        question:
            questionCard,

        answer:
            answerCard

    });


    this.drawPermanentLines();


    /* QUESTION GREEN */

    questionCard.rect
        .setFillStyle(
            0xe6f7e9,
            1
        )
        .setStrokeStyle(
            4,
            0x57a96c,
            1
        );


    questionCard.number
        .setFillStyle(
            0x57a96c,
            1
        );


    questionCard.dot
        .setFillStyle(
            0x57a96c,
            1
        );


    questionCard.ring
        .setScale(1)
        .setFillStyle(
            0x72c387,
            .25
        )
        .setStrokeStyle(
            3,
            0x57a96c,
            .65
        );


    /* ANSWER GREEN */

    answerCard.rect
        .setFillStyle(
            0xe6f7e9,
            1
        )
        .setStrokeStyle(
            4,
            0x57a96c,
            1
        );


    answerCard.dot
        .setFillStyle(
            0x57a96c,
            1
        );


    answerCard.ring
        .setFillStyle(
            0x72c387,
            .25
        )
        .setStrokeStyle(
            3,
            0x57a96c,
            .65
        );


    this.correctBurst(

        answerCard.dotX,

        answerCard.dotY

    );


    this.showToast(
        "BETUL! Padanan berjaya.",
        true
    );


    this.updateProgress();


    const stageComplete=
        this.questionCards.every(
            card=>card.matched
        );


    if(
        stageComplete
    ){

        this.completeStage();

    }

}


/* =====================================================
   WRONG
===================================================== */

wrongLine(
    questionCard,
    answerCard
){

    this.draggingLine=false;

    this.activeQuestion=null;


    this.tempLineGraphics.clear();


    this.mistakes++;


    this.updateProgress();


    /* DRAW RED WRONG LINE */

    const wrongGraphics=
        this.add.graphics()
        .setDepth(30);


    this.stageGroup.add(
        wrongGraphics
    );


    wrongGraphics.lineStyle(
        13,
        0xffffff,
        .95
    );


    wrongGraphics.beginPath();


    wrongGraphics.moveTo(

        questionCard.dotX,

        questionCard.dotY

    );


    wrongGraphics.lineTo(

        answerCard.dotX,

        answerCard.dotY

    );


    wrongGraphics.strokePath();


    wrongGraphics.lineStyle(
        7,
        0xd85858,
        1
    );


    wrongGraphics.beginPath();


    wrongGraphics.moveTo(

        questionCard.dotX,

        questionCard.dotY

    );


    wrongGraphics.lineTo(

        answerCard.dotX,

        answerCard.dotY

    );


    wrongGraphics.strokePath();


    questionCard.dot
        .setFillStyle(
            0xd85858,
            1
        );


    answerCard.dot
        .setFillStyle(
            0xd85858,
            1
        );


    questionCard.ring
        .setScale(1);


    this.cameras.main.shake(
        100,
        .003
    );


    this.showToast(
        "SALAH! Cuba sambung ke jawapan lain.",
        false
    );


    this.tweens.add({

        targets:
            wrongGraphics,

        alpha:
            0,

        duration:
            350,

        delay:
            180,

        onComplete:()=>{

            wrongGraphics.destroy();

        }

    });


    this.time.delayedCall(
        400,
        ()=>{

            if(
                !questionCard.matched
            ){

                questionCard.dot
                    .setFillStyle(
                        0x2f9bc0,
                        1
                    );

            }


            if(
                !answerCard.matched
            ){

                answerCard.dot
                    .setFillStyle(
                        0xe1b73c,
                        1
                    );

            }

        }
    );

}


/* =====================================================
   CANCEL
===================================================== */

cancelLine(){

    this.tempLineGraphics.clear();


    if(
        this.activeQuestion &&
        !this.activeQuestion.matched
    ){

        this.activeQuestion.dot
            .setFillStyle(
                0x2f9bc0,
                1
            );


        this.activeQuestion.ring
            .setScale(1);

    }


    this.draggingLine=false;

    this.activeQuestion=null;

}


/* =====================================================
   PERMANENT LINES
===================================================== */

drawPermanentLines(){

    const g=
        this.lineGraphics;


    g.clear();


    for(
        const connection
        of this.connections
    ){

        const q=
            connection.question;


        const a=
            connection.answer;


        /* WHITE BORDER */

        g.lineStyle(
            13,
            0xffffff,
            .96
        );


        g.beginPath();


        g.moveTo(
            q.dotX,
            q.dotY
        );


        g.lineTo(
            a.dotX,
            a.dotY
        );


        g.strokePath();


        /* GREEN */

        g.lineStyle(
            7,
            0x57a96c,
            1
        );


        g.beginPath();


        g.moveTo(
            q.dotX,
            q.dotY
        );


        g.lineTo(
            a.dotX,
            a.dotY
        );


        g.strokePath();

    }

}


/* =====================================================
   FULL QUESTION
===================================================== */

showFullQuestion(
    question
){

    this.questionPanelTitle.setText(

        "SOALAN "+
        question.id

    );


    this.fullQuestionText.setText(
        question.q
    );

}


/* =====================================================
   CORRECT BURST
===================================================== */

correctBurst(
    x,
    y
){

    for(
        let i=0;
        i<9;
        i++
    ){

        const angle=
            Phaser.Math.FloatBetween(
                0,
                Math.PI*2
            );


        const distance=
            Phaser.Math.Between(
                30,
                75
            );


        const particle=
            this.add.circle(

                x,
                y,

                Phaser.Math.Between(
                    4,
                    8
                ),

                0x68b87d,
                1

            );


        particle.setDepth(
            40
        );


        this.stageGroup.add(
            particle
        );


        this.tweens.add({

            targets:
                particle,

            x:
                x+
                Math.cos(angle)*
                distance,

            y:
                y+
                Math.sin(angle)*
                distance,

            alpha:
                0,

            scaleX:
                .25,

            scaleY:
                .25,

            duration:
                450,

            onComplete:()=>{

                particle.destroy();

            }

        });

    }

}


/* =====================================================
   TOAST MESSAGE
===================================================== */

showToast(
    message,
    correct
){

    if(
        this.toastBackground &&
        this.toastBackground.active
    ){

        this.toastBackground.destroy();

    }


    if(
        this.toastText &&
        this.toastText.active
    ){

        this.toastText.destroy();

    }


    this.toastBackground=
        this.add.rectangle(
            450,
            1019,
            520,
            54,
            correct
                ? 0x358853
                : 0xb74f4f,
            .96
        )
        .setDepth(60);


    this.toastBackground
        .setStrokeStyle(
            2,
            0xffffff,
            .9
        );


    this.toastText=
        this.add.text(
            450,
            1019,
            message,
            {

                fontFamily:
                    "Trebuchet MS, Arial",

                fontSize:
                    "18px",

                fontStyle:
                    "bold",

                color:
                    "#ffffff"

            }

        )
        .setOrigin(.5)
        .setDepth(61);


    this.stageGroup.addMultiple([

        this.toastBackground,
        this.toastText

    ]);


    this.tweens.add({

        targets:[

            this.toastBackground,
            this.toastText

        ],

        alpha:0,

        delay:800,

        duration:250

    });

}


/* =====================================================
   FOOTER
===================================================== */

createFooter(){

    this.footerBg=
        this.add.rectangle(
            450,
            1095,
            555,
            68,
            0x2e6c84,
            .35
        );


    this.footerBg
        .setStrokeStyle(
            3,
            0xffffff,
            .8
        );


    this.footerText=
        this.add.text(
            450,
            1095,
            "SAMBUNGKAN SEMUA 5 PASANGAN",
            {

                fontFamily:
                    "Trebuchet MS, Arial",

                fontSize:
                    "18px",

                fontStyle:
                    "bold",

                color:
                    "#ffffff"

            }

        ).setOrigin(.5);


    this.footerText.setAlpha(
        .75
    );


    this.stageGroup.addMultiple([

        this.footerBg,
        this.footerText

    ]);

}


/* =====================================================
   COMPLETE STAGE
===================================================== */

completeStage(){

    const finalStage=

        this.stageIndex===
        STAGES.length-1;


    this.footerBg
        .setAlpha(1)
        .setFillStyle(

            finalStage
                ? 0x71529a
                : 0x286d86,

            1

        );


    this.footerText
        .setAlpha(1)
        .setText(

            finalStage
                ? "TAHNIAH! MAIN SEMULA"
                : "STAGE SETERUSNYA ▶"

        );


    this.footerBg.setInteractive({
        useHandCursor:true
    });


    this.footerText.setInteractive({
        useHandCursor:true
    });


    const nextStage=()=>{


        this.footerBg
            .disableInteractive();


        this.footerText
            .disableInteractive();


        if(
            finalStage
        ){

            this.stageIndex=0;

            this.totalCorrect=0;

            this.mistakes=0;

        }

        else{

            this.stageIndex++;

        }


        this.buildStage();

    };


    this.footerBg.once(

        "pointerdown",

        nextStage

    );


    this.footerText.once(

        "pointerdown",

        nextStage

    );


    this.showToast(

        finalStage
            ? "Hebat! Semua 25 soalan selesai!"
            : "Stage lengkap!",

        true

    );

}


/* =====================================================
   PROGRESS
===================================================== */

updateProgress(){

    this.progressText.setText(

        "Padanan "+
        this.totalCorrect+
        "/25 • Silap "+
        this.mistakes

    );

}

}
